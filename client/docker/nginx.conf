server {
  listen 80;
  server_name _;

  # mime.types уже подключён глобально.
  # Добавим только mjs, без js, чтобы не было "duplicate extension".
  types { application/javascript mjs; }

  root /usr/share/nginx/html;
  index index.html;

  # Проксируем фронтовый префикс -> gateway /api/v1/
  location /course_api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_redirect off;
    proxy_buffering off;
    proxy_set_header X-Accel-Buffering no;

    # Меняем /course_api/ на /api/v1/ без rewrite
    proxy_pass http://gateway-dev:3000/api/v1/;
  }

  location /socket.io/  {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_set_header X-Accel-Buffering no;
    #TODO: указать правильный путь
    # proxy_pass http://ws:3001/socket.io/; 
    proxy_pass http://gateway-dev:3000/api/v1/socket.io/;
  }

  # Swagger как есть
  location /docs/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_pass http://gateway-dev:3000/;
  }

  # Кэш статики
  location ~* \.(?:mjs|js|css|woff2?|ttf|eot|ico|svg|png|jpg|jpeg|gif)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }
}